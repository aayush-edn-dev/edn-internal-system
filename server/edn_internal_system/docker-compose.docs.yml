services:
  docs:
    image: edn_internal_system_local_docs
    container_name: edn_internal_system_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./edn_internal_system:/app/edn_internal_system:z
    ports:
      - '9000:9000'
    command: /start-docs
